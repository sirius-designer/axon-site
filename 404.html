<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>找不到頁面</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .nf { min-height: 62vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 0; }
  .nf-dots { display: grid; grid-template-columns: repeat(3, 18px); gap: 10px; margin-bottom: 40px; }
  .nf-dots i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .nf-dots .l { background: var(--lime); } .nf-dots .g { background: var(--gray); } .nf-dots .k { background: var(--ink); }
  .nf-dots .o { box-shadow: inset 0 0 0 1.5px var(--gray); }
  .nf-code { font-family: var(--serif); font-size: 48px; font-weight: 400; letter-spacing: .12em; line-height: 1.2; }
  .nf-en { margin-top: 10px; font-size: 13px; letter-spacing: .12em; color: var(--mute); }
  .nf-en::before { content: ""; display: inline-block; width: 28px; height: 10px; border-radius: 999px; background: var(--lime); margin-right: 12px; vertical-align: 0; }
  .nf-title { margin-top: 36px; font-family: var(--serif); font-size: 20px; font-weight: 400; letter-spacing: .08em; }
  .nf-text { margin-top: 12px; font-size: 15px; color: var(--mute); }
  .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 36px; }
  .nf-actions .ghost { background: none; box-shadow: inset 0 0 0 1px var(--ink); }
  .nf-actions .ghost:hover { background: var(--ink); color: var(--lime); box-shadow: none; }
</style>
</head>
<body data-page="notfound">
<main>
  <section class="nf">
    <div class="nf-dots" aria-hidden="true"><i class="l"></i><i class="g"></i><i class="k"></i><i class="g"></i><i class="o"></i><i class="l"></i><i class="k"></i><i class="l"></i><i class="g"></i></div>
    <h1 class="nf-code">404</h1>
    <p class="nf-en" lang="en">Page Not Found</p>
    <h2 class="nf-title">找不到這個頁面</h2>
    <p class="nf-text">你要找的頁面可能已經移動、改名，或是網址輸入有誤。</p>
    <div class="nf-actions">
      <a class="pill" href="/">回到首頁</a>
      <a class="pill ghost" href="works">瀏覽作品</a>
    </div>
  </section>
</main>
<script src="assets/app.js"></script>
</body>
</html>
