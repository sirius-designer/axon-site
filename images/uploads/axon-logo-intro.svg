<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" class="play" viewBox="17.56 -1.63 220 146.67" role="img" aria-label="AXON 標誌開場動畫：九個圓點像球一樣彈跳，左排中間的白點以拋物線飛出變成標誌圖形，萊姆綠光條劃出字標與標語" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AXON 標誌開場動畫</title>
<style><![CDATA[
.pp{fill:var(--to)}
.bar{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .play .pp{transform-box:fill-box;transform-origin:center;
    animation:pop .7s cubic-bezier(.34,1.56,.64,1) calc(0.2s + var(--k)*.09s) both,
              recolor .6s ease-in-out calc(7.3s + var(--k)*.07s) both}
  .play .bnc{transform-box:fill-box;transform-origin:50% 100%;
    animation:ball 1.9s linear calc(1.1s + var(--c)*.15s) both}
  .play .grid{animation:travel 1s cubic-bezier(.65,0,.25,1) 3.35s both}
  .play .slot{transform-box:fill-box;transform-origin:center;
    animation:vanish .01s linear 4.45s both, refill .6s cubic-bezier(.34,1.56,.64,1) 7.45s forwards}
  .play .spawn{transform-box:fill-box;transform-origin:center;
    animation:show .01s linear 4.45s both, grow 1.15s cubic-bezier(.45,0,.35,1) 4.45s both,
              settle .45s ease-out 5.60s both}
  .play .fx{animation:fx 1.15s cubic-bezier(.35,.12,.65,.88) 4.45s both}
  .play .fy{animation:fy 1.15s linear 4.45s both}
  .play .cut{transform-box:fill-box;transform-origin:center;animation:cutin .65s cubic-bezier(.34,1.4,.64,1) var(--d) both}
  .play .wp{animation:wipe 1.3s cubic-bezier(.45,0,.25,1) 6.0s both}
  .play .bar{animation:bar 1.3s cubic-bezier(.45,0,.25,1) 6.0s both}
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes recolor{from{fill:var(--from)}to{fill:var(--to)}}
@keyframes ball{
  0%{transform:none;animation-timing-function:cubic-bezier(.45,0,.55,1)}
  7%{transform:scale(1.1,.88);animation-timing-function:cubic-bezier(.33,1,.68,1)}
  30%{transform:translateY(-11px) scale(.95,1.06);animation-timing-function:cubic-bezier(.32,0,.67,0)}
  50%{transform:scale(1.13,.85);animation-timing-function:cubic-bezier(.33,1,.68,1)}
  66%{transform:translateY(-4.5px) scale(.98,1.02);animation-timing-function:cubic-bezier(.32,0,.67,0)}
  79%{transform:scale(1.06,.93);animation-timing-function:cubic-bezier(.33,1,.68,1)}
  88%{transform:translateY(-1.4px);animation-timing-function:cubic-bezier(.32,0,.67,0)}
  95%{transform:scale(1.02,.98);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  100%{transform:none}}
@keyframes travel{from{transform:translateX(-73.34px)}to{transform:none}}
@keyframes vanish{from{opacity:1}to{opacity:0}}
@keyframes refill{from{opacity:1;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scale(0.3652)}to{transform:scale(1)}}
@keyframes settle{0%{transform:scale(1)}35%{transform:scale(1.05,.95)}100%{transform:scale(1)}}
@keyframes fx{from{transform:translate(135.63px,0.56px)}to{transform:none}}
@keyframes fy{0%{transform:none;animation-timing-function:cubic-bezier(.25,.46,.45,.94)}
  50%{transform:translateY(-30px);animation-timing-function:cubic-bezier(.55,.085,.68,.53)}
  100%{transform:none}}
@keyframes cutin{from{transform:scale(0) rotate(-70deg)}to{transform:none}}
@keyframes wipe{from{transform:translateX(-440px)}to{transform:none}}
@keyframes bar{0%,18%{opacity:0}0%{transform:translateX(-440px)}28%,80%{opacity:1}100%{opacity:0;transform:none}}
]]></style>
