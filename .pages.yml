# Pages CMS 後台設定：https://pagescms.org
media:
  input: images/uploads
  output: images/uploads

content:
  - name: works
    label: 作品
    type: file
    path: content/works.json
    format: json
    fields:
      - name: works
        label: 作品列表
        type: object
        list: true
        fields:
          - { name: title, label: 專案名稱, type: string, required: true }
          - { name: slug, label: 網址代稱（英文小寫與連字號，例如 tea-brand）, type: string, required: true }
          - { name: client, label: 客戶, type: string }
          - name: categories
            label: 類別（可複選）
            type: select
            options:
              multiple: true
              values: [ESG／永續報告書設計, 指標系統設計, 品牌重塑, 品牌識別, 視覺設計, 包裝設計, 網站設計, 品牌設計, 動態設計]
          - { name: year, label: 年份, type: string }
          - { name: featured, label: 顯示在首頁, type: boolean }
          - { name: cover, label: 封面圖, type: image }
          - { name: description, label: 專案簡介（顯示在標題旁，可留空）, type: text }
          - name: blocks
            label: 內頁版面（依序堆疊；有加區塊時，下方「舊版內頁圖片」不會顯示）
            type: object
            list: true
            fields:
              - name: type
                label: 區塊類型
                type: select
                required: true
                options:
                  values: [標題, 文字, 製作名單, 圖片, 圖文並排, 分隔線]
              - { name: text, label: 文字（標題／文字／製作名單／圖文並排用；製作名單每行寫「職稱｜名字」；**粗體**）, type: text }
              - { name: images, label: 圖片（圖片／圖文並排用）, type: image, list: true }
              - name: columns
                label: 圖片欄數（圖片區塊用）
                type: select
                options:
                  values: ["1", "2", "3"]
              - name: ratio
                label: 圖片比例（圖片區塊用；固定比例會自動裁切置中）
                type: select
                options:
                  values: [原比例, 正方形 1:1, 橫式 3:2, 直式 4:5]
              - { name: caption, label: 圖片說明（選填）, type: string }
              - name: imageSide
                label: 圖片位置（圖文並排用）
                type: select
                options:
                  values: [左, 右]
          - { name: images, label: 舊版內頁圖片（沒有使用內頁版面時才顯示）, type: image, list: true }

  - name: site
    label: 網站資訊
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: 工作室名稱, type: string }
      - { name: taglineEn, label: 英文標語, type: string }
      - { name: descriptor, label: 公司說明（例如 Creative Design Firm）, type: string }
      - { name: seoTitle, label: 網站標題（顯示在瀏覽器分頁與 Google 搜尋結果）, type: string }
      - { name: company, label: 公司全名, type: string }
      - { name: logo, label: LOGO（白色、去背，建議 SVG）, type: image }
      - { name: tagline, label: 首頁中文標語, type: string }
      - { name: subline, label: 首頁標語下方說明, type: text }
      - { name: intro, label: 關於我們, type: text }
      - { name: email, label: Email, type: string }
      - { name: phone, label: 電話, type: string }
      - { name: address, label: 地址, type: string }
      - { name: taxId, label: 統一編號, type: string }
      - { name: line, label: LINE 連結, type: string }
      - { name: instagram, label: Instagram 連結, type: string }
      - { name: facebook, label: Facebook 連結, type: string }
      - name: categories
        label: 作品分類（中英文名稱與排列順序）
        type: object
        list: true
        fields:
          - { name: name, label: 中文名稱（需與作品的類別選項一致）, type: string }
          - { name: en, label: 英文名稱, type: string }
      - name: services
        label: 服務項目
        type: object
        list: true
        fields:
          - { name: title, label: 項目名稱, type: string }
          - { name: body, label: 說明, type: text }
