# Pages CMS 後台設定：https://pagescms.org
media:
  input: images/uploads
  output: images/uploads

content:
  - name: works
    label: 作品
    type: file
    path: content/works.json
    format: json
    fields:
      - name: works
        label: 作品列表
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "作品 {index}｜{title}"
        fields:
          - { name: title, label: 專案名稱, type: string, required: true }
          - { name: slug, label: 網址代稱（英文小寫與連字號，例如 tea-brand）, type: string, required: true }
          - { name: client, label: 客戶, type: string }
          - name: categories
            label: 類別（可複選）
            type: select
            options:
              multiple: true
              values: [ESG / 永續報告書設計, 指標系統設計, 品牌重塑, 品牌識別, 視覺設計, 包裝設計, 網站設計, 品牌設計, 動態設計]
          - name: tasks
            label: 設計項目（可複選，顯示在作品牆標題下方）
            type: select
            options:
              multiple: true
              values: [主視覺設計, 封面設計, 插畫繪製, 內頁編排, 資訊圖表設計, 影像修圖, 攝影, LOGO設計, 品牌識別系統, 包裝設計, 印刷監製, 網站設計, 動態影像]
          - { name: tasksCustom, label: 其他設計項目（選單裡沒有的，按 Add an item 自行新增）, type: string, list: true }
          - { name: year, label: 年份, type: string }
          - { name: award, label: 獲獎／備註（選填，例如 TCSA 2024企業永續獎-白金級）, type: string }
          - { name: featured, label: 顯示在首頁, type: boolean }
          - { name: cover, label: 封面圖, type: image }
          - { name: description, label: 專案簡介（顯示在標題旁，可留空）, type: text }
          - name: blocks
            label: 內頁版面（依序堆疊；有加區塊時，下方「舊版內頁圖片」不會顯示）
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "▸ 區塊 {index}｜{type}"
            fields:
              - name: type
                label: 區塊類型
                type: select
                required: true
                options:
                  values: [標題, 文字, 製作名單, 圖片, 圖文並排, 分隔線]
              - { name: text, label: 文字（標題／文字／製作名單／圖文並排用；製作名單每行寫「職稱｜名字」；**粗體**）, type: text }
              - name: width
                label: 文字幅寬（標題／文字／製作名單用；不選＝二分之一）
                type: select
                options:
                  values: [全幅, 二分之一, 三分之一]
              - { name: images, label: 圖片（圖片／圖文並排用）, type: image, list: true }
              - name: columns
                label: 圖片欄數（圖片區塊用）
                type: select
                options:
                  values: ["1", "2", "3"]
              - name: ratio
                label: 圖片比例（圖片區塊用；固定比例會自動裁切置中）
                type: select
                options:
                  values: [原比例, 正方形 1:1, 橫式 3:2, 直式 4:5]
              - { name: caption, label: 圖片說明（選填）, type: string }
              - name: imageSide
                label: 圖片位置（圖文並排用）
                type: select
                options:
                  values: [左, 右]
          - { name: images, label: 舊版內頁圖片（沒有使用內頁版面時才顯示）, type: image, list: true }

  - name: site
    label: 網站資訊
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: 【基本】工作室名稱, type: string }
      - { name: company, label: 【基本】公司全名, type: string }
      - { name: logo, label: 【基本】LOGO（白色、去背，建議 SVG）, type: image }
      - { name: seoTitle, label: 【基本】網站標題（顯示在瀏覽器分頁與 Google 搜尋結果）, type: string }
      - { name: tagline, label: 【首頁】中文標語, type: string }
      - { name: taglineEn, label: 【首頁】英文標語, type: string }
      - { name: subline, label: 【首頁】標語下方說明, type: text }
      - name: categories
        label: 【作品】作品分類（中英文名稱與排列順序）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} {en}"
        fields:
          - { name: name, label: 中文名稱（需與作品的類別選項一致）, type: string }
          - { name: en, label: 英文名稱, type: string }
      - { name: servicesIntro, label: 【服務】介紹文字（按 Enter 可自行斷行）, type: text }
      - name: services
        label: 【服務】服務項目（依序排列）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: icon, label: 圖示（SVG）, type: image }
          - { name: title, label: 服務名稱, type: string }
          - { name: en, label: 英文名稱, type: string }
          - { name: body, label: 說明, type: text }
          - { name: items, label: 服務細項（一項一行，按 Add an item 新增）, type: string, list: true }
          - { name: linkLabel, label: 按鈕文字（例如：填寫需求表；留空＝不顯示按鈕）, type: string }
          - { name: link, label: 按鈕連結（需求表網址，或填 contact 連到聯絡頁）, type: string }
      - name: about
        label: 【關於】關於頁
        type: object
        fields:
          - { name: cover, label: 封面形象照片（建議橫式 2400×1200、JPG、600KB 以內）, type: image }
          - name: coverText
            label: 封面文字顏色
            type: select
            options:
              values: [深色, 白色]
          - { name: eyebrow, label: 封面英文標語, type: string }
          - { name: title, label: 封面中文標題, type: string }
          - { name: lead, label: 引言, type: text }
          - { name: body, label: 公司介紹（空一行＝分段）, type: text }
          - { name: valuesHeading, label: 核心價值區塊標題, type: string }
          - { name: valuesEn, label: 核心價值英文標題, type: string }
          - { name: valuesTitle, label: 核心價值主標語, type: string }
          - { name: valuesIntro, label: 核心價值說明, type: text }
          - name: values
            label: 三個價值
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: icon, label: 圖示（SVG）, type: image }
              - { name: title, label: 標題, type: string }
              - { name: text, label: 說明, type: text }
      - { name: contactIntro, label: 【聯絡】說明文字（空一行＝分段）, type: text }
      - { name: email, label: 【聯絡】Email, type: string }
      - { name: phone, label: 【聯絡】電話, type: string }
      - { name: address, label: 【聯絡】地址, type: string }
      - { name: taxId, label: 【聯絡】統一編號, type: string }
      - { name: line, label: 【聯絡】LINE 連結, type: string }
      - { name: lineQr, label: 【聯絡】LINE QR code 圖片（建議 SVG）, type: image }
      - name: forms
        label: 【聯絡】設計需求表按鈕（網址留空＝顯示「準備中」）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: 按鈕標題, type: string }
          - { name: desc, label: 簡短說明, type: string }
          - { name: url, label: 表單網址, type: string }
      - { name: web3formsKey, label: 【聯絡】表單收信金鑰（Web3Forms Access Key，請勿任意更改）, type: string }
      - { name: instagram, label: 【社群】Instagram 連結（填了才會出現在頁尾）, type: string }
      - { name: facebook, label: 【社群】Facebook 連結（填了才會出現在頁尾）, type: string }
